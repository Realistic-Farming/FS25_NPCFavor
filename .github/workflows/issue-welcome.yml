name: Issue — Welcome & Label

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply user-replied label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['user-replied']
            });

      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repoName = context.repo.repo;

            const body = [
              `Hey @${author}, welcome to the village! 🏡`,
              ``,
              `Thanks for opening this issue — the neighbors have been notified. @TheCodingDad-TisonK will stop by as soon as possible.`,
              ``,
              `**While you wait, please make sure you've included:**`,
              ``,
              `- [ ] You are running the latest version of NPC Favor (visible in the mod manager)`,
              `- [ ] Your issue includes the relevant \`[NPC Favor]\` lines from \`log.txt\``,
              `  - Log location: \`Documents/My Games/FarmingSimulator2025/log.txt\``,
              `  - Search for \`[NPC Favor]\` and paste the relevant section here`,
              `- [ ] If this involves a specific NPC (Mia, Hans, etc.) — note their name and what quest or interaction triggered the problem`,
              `- [ ] You have searched [existing issues](https://github.com/${context.repo.owner}/${repoName}/issues) to avoid duplicates`,
              ``,
              `> **Note:** Issues without a log snippet are difficult to investigate and may be closed. A log is almost always required to reproduce bugs.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
